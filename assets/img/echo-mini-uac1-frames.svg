<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="290" fill="#ffffff"/>
  <text x="20" y="62" font-weight="bold" font-size="16">UAC1</text>
  <text x="20" y="82" fill="#555">full speed</text>
  <text x="20" y="100" fill="#555">12 Mbit/s</text>
  <rect x="170" y="40" width="400" height="70" fill="#f1f3f6"/>
  <rect x="570" y="40" width="400" height="70" fill="#e6e9ee"/>
  <line x1="170" y1="32" x2="170" y2="118" stroke="#333" stroke-width="2"/>
  <text x="170" y="26" font-size="12" text-anchor="middle" fill="#333">SOF</text>
  <line x1="570" y1="32" x2="570" y2="118" stroke="#333" stroke-width="2"/>
  <text x="570" y="26" font-size="12" text-anchor="middle" fill="#333">SOF</text>
  <line x1="970" y1="32" x2="970" y2="118" stroke="#333" stroke-width="2"/>
  <text x="970" y="26" font-size="12" text-anchor="middle" fill="#333">SOF</text>
  <text x="370" y="130" font-size="12" text-anchor="middle" fill="#555">frame, 1 ms</text>
  <rect x="182" y="50" width="200" height="24" rx="3" fill="#2b6cb0"/>
  <text x="282.0" y="67.0" fill="#fff" font-size="13" text-anchor="middle">OUT audio, 44 or 45 frames</text>
  <rect x="392" y="78" width="70" height="22" rx="3" fill="#dd6b20"/>
  <text x="427.0" y="94.0" fill="#fff" font-size="13" text-anchor="middle">IN 3 B</text>
  <text x="770" y="130" font-size="12" text-anchor="middle" fill="#555">frame, 1 ms</text>
  <rect x="582" y="50" width="200" height="24" rx="3" fill="#2b6cb0"/>
  <text x="682.0" y="67.0" fill="#fff" font-size="13" text-anchor="middle">OUT audio, 44 or 45 frames</text>
  <rect x="792" y="78" width="70" height="22" rx="3" fill="#dd6b20"/>
  <text x="827.0" y="94.0" fill="#fff" font-size="13" text-anchor="middle">IN 3 B</text>
  <line x1="170" y1="160" x2="970" y2="160" stroke="#333"/>
  <line x1="170" y1="155" x2="170" y2="165" stroke="#333"/>
  <text x="170" y="180" font-size="12" text-anchor="middle" fill="#333">0</text>
  <line x1="370" y1="155" x2="370" y2="165" stroke="#333"/>
  <text x="370" y="180" font-size="12" text-anchor="middle" fill="#333">0.5 ms</text>
  <line x1="570" y1="155" x2="570" y2="165" stroke="#333"/>
  <text x="570" y="180" font-size="12" text-anchor="middle" fill="#333">1 ms</text>
  <line x1="770" y1="155" x2="770" y2="165" stroke="#333"/>
  <text x="770" y="180" font-size="12" text-anchor="middle" fill="#333">1.5 ms</text>
  <line x1="970" y1="155" x2="970" y2="165" stroke="#333"/>
  <text x="970" y="180" font-size="12" text-anchor="middle" fill="#333">2 ms</text>
  <rect x="20" y="200" width="18" height="14" rx="2" fill="#2b6cb0"/>
  <text x="46" y="212" font-weight="bold">OUT audio</text><text x="135" y="212">(host → player), one packet per 1 ms frame: 44 or 45 frames at 44.1 kHz,</text>
  <text x="135" y="232">176 or 180 B in 16 bits, 264 or 270 B in 24 bits.</text>
  <rect x="20" y="246" width="18" height="14" rx="2" fill="#dd6b20"/>
  <text x="46" y="258" font-weight="bold">IN feedback</text><text x="135" y="258">(player → host), every frame: 3 B, samples per frame in 10.14 (e.g. 44.1017).</text>
  <text x="980" y="282" font-size="11" fill="#777" text-anchor="end">Packet widths not to scale.</text>
</svg>
