  <text x="46" y="212" font-weight="bold">OUT audio</text><text x="135" y="212">(host → player), 24 or 32 bits: one packet every 2 microframes (250 µs), always on</text>
  <text x="135" y="232">the same parity: 48 frames of 8 B at 192 kHz, 384 B; 392 B at most, which fits in the 147-word</text>
  <text x="135" y="252">RX FIFO. 16 bits keeps one packet every 500 µs (97 frames of 4 B at 192 kHz, 388 B).</text>
  <rect x="20" y="266" width="18" height="14" rx="2" fill="#dd6b20"/>
  <text x="46" y="278" font-weight="bold">IN feedback</text><text x="135" y="278">(player → host), every 8 microframes (1 ms): 4 B, samples per microframe</text>
  <text x="135" y="298">in 16.16 (24.0 at 192 kHz).</text>
  <text x="980" y="322" font-size="11" fill="#777" text-anchor="end">Packet widths not to scale.</text>
