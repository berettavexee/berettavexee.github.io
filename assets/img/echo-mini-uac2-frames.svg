  <rect x="20" y="246" width="18" height="14" rx="2" fill="#dd6b20"/>
  <text x="46" y="258" font-weight="bold">IN feedback</text><text x="135" y="258">(player → host), every 8 microframes (1 ms): 4 B, samples per microframe</text>
  <text x="135" y="278">in 16.16 (12.0 at 96 kHz).</text>
  <text x="980" y="302" font-size="11" fill="#777" text-anchor="end">Packet widths not to scale.</text>
