<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dd6b20"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- host -->
  <rect x="20" y="110" width="130" height="90" rx="8" fill="#f1f3f6" stroke="#999"/>
  <text x="85" y="145" text-anchor="middle" font-weight="bold">Computer</text>
  <text x="85" y="165" text-anchor="middle" fill="#555">or phone</text>
  <text x="85" y="185" text-anchor="middle" fill="#555" font-size="12">(its own clock)</text>

  <!-- player outline -->
  <rect x="200" y="30" width="780" height="330" rx="12" fill="none" stroke="#333" stroke-width="2"/>
  <text x="215" y="55" font-weight="bold" font-size="16">ECHO MINI</text>
  <text x="310" y="55" fill="#555" font-size="12">Rockchip RKNanoD</text>

  <!-- usb controller -->
  <rect x="230" y="100" width="150" height="110" rx="6" fill="#e6e9ee" stroke="#999"/>
  <text x="305" y="128" text-anchor="middle" font-weight="bold">USB controller</text>
  <text x="305" y="148" text-anchor="middle" fill="#555" font-size="12">Synopsys DWC2</text>
  <text x="305" y="168" text-anchor="middle" fill="#555" font-size="12">RX FIFO: 147 words</text>
  <text x="305" y="188" text-anchor="middle" fill="#555" font-size="12">1 periodic IN endpoint</text>

  <!-- core A -->
  <rect x="430" y="90" width="190" height="130" rx="6" fill="#e6e9ee" stroke="#999"/>
  <text x="525" y="116" text-anchor="middle" font-weight="bold">Core A (Cortex-M3)</text>
  <text x="525" y="138" text-anchor="middle" fill="#555" font-size="12">USB interrupt: packets</text>
  <text x="525" y="154" text-anchor="middle" fill="#555" font-size="12">into the ring buffer</text>
  <text x="525" y="176" text-anchor="middle" fill="#555" font-size="12">PI control on the fill:</text>
  <text x="525" y="192" text-anchor="middle" fill="#555" font-size="12">the feedback value</text>
  <text x="525" y="208" text-anchor="middle" fill="#555" font-size="12">screen, keys, volume</text>

  <!-- ring -->
  <rect x="670" y="105" width="120" height="50" rx="6" fill="#f1f3f6" stroke="#999"/>
  <text x="730" y="127" text-anchor="middle" font-weight="bold" font-size="13">Ring buffer</text>
  <text x="730" y="144" text-anchor="middle" fill="#555" font-size="12">target 10 ms</text>

  <!-- dma i2s -->
  <rect x="670" y="185" width="120" height="50" rx="6" fill="#f1f3f6" stroke="#999"/>
  <text x="730" y="207" text-anchor="middle" font-weight="bold" font-size="13">DMA → I2S</text>
  <text x="730" y="224" text-anchor="middle" fill="#555" font-size="12">64-bit frames</text>

  <!-- dacs -->
  <rect x="830" y="150" width="130" height="40" rx="6" fill="#e6e9ee" stroke="#999"/>
  <text x="895" y="175" text-anchor="middle" font-weight="bold" font-size="13">CS43131 (left)</text>
  <rect x="830" y="230" width="130" height="40" rx="6" fill="#e6e9ee" stroke="#999"/>
  <text x="895" y="255" text-anchor="middle" font-weight="bold" font-size="13">CS43131 (right)</text>

  <!-- audio clock -->
  <rect x="430" y="270" width="190" height="60" rx="6" fill="#fdf2e9" stroke="#dd6b20"/>
  <text x="525" y="295" text-anchor="middle" font-weight="bold" font-size="13">Audio clock</text>
  <text x="525" y="313" text-anchor="middle" fill="#555" font-size="12">24 MHz crystal → ACODEC PLL</text>
  <path d="M620,300 L730,300 L730,240" fill="none" stroke="#dd6b20" stroke-dasharray="5,4" marker-end="url(#b)"/>
  <text x="640" y="320" fill="#dd6b20" font-size="12">sets the sample rate</text>

  <!-- core B -->
  <rect x="230" y="270" width="150" height="60" rx="6" fill="#ffffff" stroke="#bbb" stroke-dasharray="4,3"/>
  <text x="305" y="295" text-anchor="middle" fill="#999" font-size="13">Core B (decoders)</text>
  <text x="305" y="313" text-anchor="middle" fill="#999" font-size="12">idle in this mode</text>

  <!-- data flow -->
  <line x1="150" y1="140" x2="226" y2="140" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
  <text x="188" y="130" text-anchor="middle" fill="#2b6cb0" font-size="12">audio</text>
  <line x1="380" y1="140" x2="426" y2="140" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="620" y1="130" x2="666" y2="130" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="730" y1="155" x2="730" y2="181" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
  <path d="M790,205 L810,205 L810,170 L826,170" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
  <path d="M810,205 L810,250 L826,250" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>

  <!-- feedback -->
  <line x1="426" y1="185" x2="384" y2="185" stroke="#dd6b20" stroke-width="3" marker-end="url(#b)"/>
  <line x1="226" y1="185" x2="154" y2="185" stroke="#dd6b20" stroke-width="3" marker-end="url(#b)"/>
  <text x="188" y="205" text-anchor="middle" fill="#dd6b20" font-size="12">feedback</text>

  <!-- legend -->
  <rect x="20" y="375" width="18" height="10" rx="2" fill="#2b6cb0"/>
  <text x="46" y="385" font-size="12">PCM samples (isochronous OUT, the host's clock)</text>
  <rect x="380" y="375" width="18" height="10" rx="2" fill="#dd6b20"/>
  <text x="406" y="385" font-size="12">“send me N samples per frame” (isochronous IN), and the player's own clock</text>
</svg>
